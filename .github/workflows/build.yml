name: Build Flutter Packages

on:
  push:
    branches: [master]
    paths:
      - "src/flutter/**"
      - ".github/workflows/build.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "src/flutter/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/flutter
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    needs: analyze
    defaults:
      run:
        working-directory: src/flutter
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: android-arm64
          - abi: armeabi-v7a
            target: android-arm
          - abi: x86_64
            target: android-x64
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --target-platform ${{ matrix.target }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk netcalc-${{ matrix.abi }}.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.abi }}
          path: src/flutter/netcalc-${{ matrix.abi }}.apk

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    needs: analyze
    defaults:
      run:
        working-directory: src/flutter
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "netcalc-windows-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: windows-x64
          path: src/flutter/netcalc-windows-x64.zip

  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    needs: analyze
    defaults:
      run:
        working-directory: src/flutter
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tar -czf netcalc-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: linux-x64
          path: src/flutter/netcalc-linux-x64.tar.gz

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [android, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2.6.2
        with:
          generate_release_notes: true
          files: artifacts/**
