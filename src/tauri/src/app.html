<!doctype html>
<html lang="en" style="background-color: #0b0f19;">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="NetCalc - Personal finance and savings calculator with live currency conversion and math expression staging." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>NetCalc - Personal Finance & Savings Tracker</title>
    <style>
      html, body {
        background-color: #0b0f19 !important;
        color: #f1f5f9;
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #initial-app-loader {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: #0b0f19;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.85rem;
        z-index: 9999;
        color: #94a3b8;
      }
      .initial-spin {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(16, 185, 129, 0.2);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: init-spin 0.8s linear infinite;
      }
      @keyframes init-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" style="background-color: #0b0f19; margin: 0; color: #f1f5f9;">
    <div style="display: contents">
      <div id="initial-app-loader">
        <div class="initial-spin"></div>
        <span style="font-size: 0.88rem; font-weight: 500;">Starting NetCalc...</span>
      </div>
      %sveltekit.body%
    </div>
  </body>
</html>
